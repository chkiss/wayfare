# nginx vhost for the wayfare microsite.
#
# This is the *bootstrap* form: port 80 only. Install it, then run
#   certbot --nginx -d wayfare.example.com
# and certbot adds the TLS server block, the certificate lines and the
# HTTP-to-HTTPS redirect itself.
#
# Do not add `listen 443 ssl` by hand before the certificate exists — nginx -t
# fails on an ssl listener with no certificate, and you end up unable to
# reload nginx for the site that is already running.
#
# Install:
#   sudo cp deploy/nginx-wayfare.conf /etc/nginx/sites-available/wayfare.example.com.conf
#   sudo ln -s /etc/nginx/sites-available/wayfare.example.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace wayfare.example.com throughout with your own hostname.

server {
    listen 80;
    listen [::]:80;
    server_name wayfare.example.com;

    # Booking PDFs and phone screenshots; the app refuses anything larger.
    client_max_body_size 20m;

    # This site accepts uploads and writes to a calendar. Keep it out of
    # search indexes and out of other people's frames.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Rate limit: the bearer token is the real defence, this just blunts
    # scanning. Needs the zone declared once in the http{} block, see
    # deploy/wayfare-limit.conf.
    limit_req zone=wayfare burst=20 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # OCR on a multi-page scan is not instant.
    }
}
